name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  # Verify commit signatures on PRs
  verify-signatures:
    runs-on: [self-hosted, linux]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify commit signatures
        run: |
          echo "Checking commit signatures for PR commits..."
          # Get the merge base and check all commits since then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          UNSIGNED_COMMITS=""
          while IFS= read -r commit; do
            if ! git verify-commit "$commit" 2>/dev/null; then
              UNSIGNED_COMMITS="$UNSIGNED_COMMITS $commit"
            fi
          done < <(git rev-list "$BASE_SHA".."$HEAD_SHA")

          if [ -n "$UNSIGNED_COMMITS" ]; then
            echo "::warning::The following commits are not signed:$UNSIGNED_COMMITS"
            echo "Consider signing your commits with GPG. See: https://docs.github.com/en/authentication/managing-commit-signature-verification"
          else
            echo "All commits are signed!"
          fi

  # Run gosec security scanner
  gosec:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: "go.mod"

      - name: Install gosec
        # Pinned to v2.22.11; v2.23.0 emits null relationships for G703/G704
        # which CodeQL's SARIF validator rejects on upload.
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.11

      - name: Run Gosec Security Scanner
        run: gosec -no-fail -fmt sarif -out results.sarif ./...

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: results.sarif
        if: always()

  # Dependency review for PRs
  dependency-review:
    runs-on: [self-hosted, linux]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Trivy vulnerability scanning
  trivy:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy filesystem scan results
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-filesystem'
        if: always()

      - name: Run Trivy license scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'license'
          format: 'table'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
