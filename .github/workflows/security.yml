name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  # Verify commit signatures on PRs
  verify-signatures:
    runs-on: [self-hosted, linux]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify commit signatures
        run: |
          echo "Checking commit signatures for PR commits..."
          # Get the merge base and check all commits since then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          UNSIGNED_COMMITS=""
          while IFS= read -r commit; do
            if ! git verify-commit "$commit" 2>/dev/null; then
              UNSIGNED_COMMITS="$UNSIGNED_COMMITS $commit"
            fi
          done < <(git rev-list "$BASE_SHA".."$HEAD_SHA")

          if [ -n "$UNSIGNED_COMMITS" ]; then
            echo "::warning::The following commits are not signed:$UNSIGNED_COMMITS"
            echo "Consider signing your commits with GPG. See: https://docs.github.com/en/authentication/managing-commit-signature-verification"
          else
            echo "All commits are signed!"
          fi

  # Run gosec security scanner
  gosec:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v5
        with:
          go-version-file: "go.mod"

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.23.0

      - name: Run Gosec Security Scanner
        run: gosec -no-fail -fmt sarif -out results.sarif ./...

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
        with:
          sarif_file: results.sarif
        if: always()

  # Dependency review for PRs
  dependency-review:
    runs-on: [self-hosted, linux]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  # Trivy vulnerability scanning
  trivy:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy filesystem scan results
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-filesystem'
        if: always()

      - name: Run Trivy license scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'license'
          format: 'table'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
